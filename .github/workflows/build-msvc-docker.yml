name: Build Windows MSVC Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: 'Docker image tag'
        required: true
        default: 'v1.0-msvc'

jobs:
  build-and-push:
    name: Build and Push Windows Docker Image
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Windows Docker Image
        run: |
          echo "Building Docker image: kingofknights/arthur:${{ github.event.inputs.tag }}"
          docker build -f Dockerfile.windows -t kingofknights/arthur:${{ github.event.inputs.tag }} .

      - name: Push Docker Image to Docker Hub
        run: |
          echo "Pushing Docker image: kingofknights/arthur:${{ github.event.inputs.tag }}"
          docker push kingofknights/arthur:${{ github.event.inputs.tag }}
