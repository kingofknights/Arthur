name: Compile Rider (Docker Builder)

on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        description: 'Choose the Rider branch to compile'
        required: true
        default: 'master'
      message:
        type: string
        description: 'Release message / Name of artifact'
        required: true
        default: 'Rider-MinGW-Build'

jobs:
  compile:
    name: "Compile Rider using MinGW Docker Image"
    runs-on: ubuntu-latest
    
    # Run the job steps inside our pre-built Docker container
    container:
      image: kingofknights/arthur:v1.0
      # Pass login credentials if the Docker Hub repository is private
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout Rider Codebase
        uses: actions/checkout@v4
        with:
          repository: "kingofknights/Rider"
          token: ${{ secrets.Arthur_Token }}
          submodules: "true"
          ref: ${{ github.event.inputs.branch }}

      # Setup compatibility link for older versions of the container image
      - name: Setup Workspace Compatibility Link
        run: |
          rm -rf /workspace
          ln -sf /github/workspace /workspace

      - name: Compile and Install Rider
        run: /usr/local/bin/build-project

      # Compress compiled files (from dist/) into a tarball
      - name: Compress compiled artifacts
        run: |
          echo "=== Debug Directory Structure ==="
          WORKSPACE_ROOT=$(pwd)
          echo "Current working directory (workspace root): $WORKSPACE_ROOT"
          ls -la
          
          # Create dist directory if not exists, and populate it from build directory if empty
          mkdir -p "$WORKSPACE_ROOT/dist"
          if [ -z "$(ls -A "$WORKSPACE_ROOT/dist" 2>/dev/null)" ]; then
            echo "dist directory is empty. Manually copying build outputs..."
            find build -name "*.exe" -exec cp {} "$WORKSPACE_ROOT/dist/" \; 2>/dev/null || true
            find build -name "*.dll" -exec cp {} "$WORKSPACE_ROOT/dist/" \; 2>/dev/null || true
            find build -name "*.ttf" -exec cp {} "$WORKSPACE_ROOT/dist/" \; 2>/dev/null || true
            find . -maxdepth 2 -name "setting.json" -exec cp {} "$WORKSPACE_ROOT/dist/" \; 2>/dev/null || true
          fi
          
          echo "=== Contents of dist directory ==="
          ls -la "$WORKSPACE_ROOT/dist"
          
          cd "$WORKSPACE_ROOT/dist"
          echo "Compressing files from $(pwd) into $WORKSPACE_ROOT/artifact.tar..."
          tar -czvf "$WORKSPACE_ROOT/artifact.tar" *
        continue-on-error: true

      # Upload the compiled tarball as a GitHub release artifact
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.message }}
          path: artifact.tar
