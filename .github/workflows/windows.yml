name: Windows Build and Deployment

on:
  push:
    branches: ["workflow"]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update submodule
        run: |
          git submodule init
          git submodule update --recursive --remote

      - name: Install boost
        run: choco install boost-msvc-14.3

      - name: Install nlohmann json
        run: |
          git clone https://github.com/nlohmann/json.git
          cd json 
          git checkout v3.11.3
          cmake -B build -DCMAKE_GENERATOR=ninja
          cd build
          ninja install

      - name: Install fmt
        run: |
          git clone https://github.com/fmtlib/fmt.git
          cd fmt
          git checkout 11.1.4
          cmake -B build -DCMAKE_GENERATOR=ninja
          cd build
          ninja install

      - name: Install SQLiteCpp
        run: |
          git clone https://github.com/SRombauts/SQLiteCpp.git
          cd SQLiteCpp
          git checkout 3.3.2
          cmake -B build -DCMAKE_GENERATOR=ninja
          cd build
          ninja install

      - name: Configure CMake
        run: cmake -B build
        # run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: Build with CMake
        run: cmake --build build --config ${{env.BUILD_TYPE}}
