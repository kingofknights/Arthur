name: Windows Build and Deployment

on:
  push:
    branches: ["boost"]

jobs:
  job0:
    runs-on: windows-latest
    steps:
      - name: clone fmt
        uses: actions/checkout@v4
        with:
          repository: "fmtlib/fmt"
          ref: "11.2.0"

      - name: build fmt
        uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          cxx-compiler: gcc
          options: |
            FMT_TEST=OFF

      - name: install fmt
        run: cmake --install build

      - name: clone json
        uses: actions/checkout@v4
        with:
          repository: "nlohmann/json"
          ref: "v3.12.0"

      - name: build json
        uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          cxx-compiler: gcc
          options: |
            JSON_BuildTests=OFF

      - name: install json
        run: cmake --install build

      - uses: actions/checkout@v4
        with:
          repository: "jtv/libpqxx"
          ref: "7.10.0"

      - uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          cxx-compiler: gcc
          options: |
            BUILD_TEST=OFF

      - name: install
        run: cmake --install build

      - uses: actions/checkout@v4
        with:
          repository: "libsdl-org/SDL"
          ref: "release-3.2.0"

      - uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          cxx-compiler: gcc
          options: |
            SDL_TESTS=OFF
            SDL_EXAMPLES=OFF

      - name: install
        run: cmake --install build

      - uses: actions/checkout@v4
        with:
          repository: "SRombauts/SQLiteCpp"
          ref: "3.3.2"

      - uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          cxx-compiler: gcc
          options: |
            SQLITECPP_RUN_CPPLINT=OFF
            SQLITECPP_BUILD_TESTS=OFF

      - name: install
        run: cmake --install build

      - uses: MarkusJx/install-boost@v2
        id: boost
        with:
          platform: "windows"
          toolset: mingw
          boost_version: 1.74.0
          boost_install_dir: "C:/boost"

      - name: clone user repo
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          cxx-compiler: gcc
          options: |
            Boost_INCLUDE_DIR=${{steps.boost.outputs.BOOST_ROOT}}/include
            Boost_LIBRARY_DIRS=${{steps.boost.outputs.BOOST_ROOT}}/lib
