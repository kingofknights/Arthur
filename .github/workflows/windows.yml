name: Windows Build and Deployment

on:
  push:
    branches: [ "workflow" ]

env:
  BUILD_TYPE: Release
  BOOST_PRE_DOWNLOAD_LINK: https://boost.teeks99.com/bin/1.78.0/boost_1_78_0-msvc-14.3-64.exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: 'true'
          submodules: 'true'

      - name: Download boost
        run: Invoke-WebRequest -Uri ${{env.BOOST_PRE_DOWNLOAD_LINK}} --OutFile "boost_installer.exe"

      - name: Configure Arthur
        working-directory: ${{github.workspace}}/
        run: cmake -B build -DFMT_UNICODE=0

      - name: Build Arthur
        working-directory: ${{github.workspace}}/
        run: cmake --build build
