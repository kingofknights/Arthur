name: Windows Build and Deployment

on:
  push:
    branches: ["workflow"]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update submodule
        run: |
          git submodule init
          git submodule update --recursive --remote

      # - name: Install Boost
      # run: choco install boost-msvc-14.3

      - name: Install Dependencies
        # run: vcpkg install --triplet x64-windows --keep-going
        run: conan install . --output-folder=build --build=missing

      - name: Configure CMake
        # run: cmake -B build
        # run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake

      - name: Build with CMake
        run: cmake --build build --config ${{env.BUILD_TYPE}}
