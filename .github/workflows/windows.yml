name: Windows Build and Deployment

on:
  push:
    branches: [ "relesing_binary" ]

env:
  BUILD_TYPE: Release
  BOOST_PRE_DOWNLOAD_LINK: "https://boost.teeks99.com/bin/1.78.0/boost_1_78_0-msvc-14.3-64.exe"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: 'false'
          submodules: 'true'

      - name: Download boost
        run: Invoke-WebRequest -Uri ${{env.BOOST_PRE_DOWNLOAD_LINK}} -OutFile  "boost_installer.exe"

      - name: Install Boost
        run: Start-Process -FilePath "boost_installer.exe" -ArgumentList "/VERYSILENT" -Wait

      - name: Verify Installation
        run: Get-Command "boost_*" -ErrorAction SilentlyContinue

      - name: Configure Arthur
        working-directory: ${{github.workspace}}/
        run: cmake -B build -DFMT_UNICODE=0

      - name: Build Arthur
        working-directory: ${{github.workspace}}/
        run: cmake --build build

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.ARTHUR_TOKEN }}

      - name: Upload Binary
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{github.workspace}}/build
          asset_name: Arthur.exe
          asset_content_type: application/zip