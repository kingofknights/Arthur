name: Windows Build and Deployment

on:
  push:
    branches: [ "workflow" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update submodule
        run: |
          git submodule init
          git submodule update --recursive --remote

      - name: Cache Boost installation
        uses: actions/cache@v4
        with:
          path: C:\tools\chocolatey\lib\boost_msvc_14.3
          key: boost-msvc-14.3-${{ runner.os }}-${{ hashFiles('**/boost_msvc_14.3') }}
          restore-keys: |
            boost-msvc-14.3-${{ runner.os }}-

      - name: Install boost
        run: choco install boost-msvc-14.3

      - name: Configure Arthur
        working-directory: ${{github.workspace}}/
        run: cmake -B build

      - name: Build Arthur
        working-directory: ${{github.workspace}}/
        run: cmake --build build
