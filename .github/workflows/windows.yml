name: Windows Build and Deployment

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "April" ]

env:
  BUILD_TYPE: Release
  BOOST_PRE_DOWNLOAD_LINK: "https://boost.teeks99.com/bin/1.78.0/boost_1_78_0-msvc-14.3-64.exe"
  TOOLCHAIN_FILE: C:\vcpkg\scripts\buildsystems\vcpkg.cmake

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Download boost
        run: Invoke-WebRequest -Uri ${{env.BOOST_PRE_DOWNLOAD_LINK}} -OutFile  "boost_installer.exe"

      - name: Install Boost
        run: Start-Process -FilePath "boost_installer.exe" -ArgumentList "/VERYSILENT" -Wait

      - name: Install Bison + Flex
        if: false
        run: choco install winflexbison3

      - name: Configure Arthur
        working-directory: ${{github.workspace}}/
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build Arthur
        working-directory: ${{github.workspace}}/
        run: cmake --build build --config ${{env.BUILD_TYPE}} --target install

      - name: Compress the artifact
        working-directory: ${{github.workspace}}/build/${{env.BUILD_TYPE}}
        run: tar -czvf artifact.tar *.exe *.ttf setting.json
        continue-on-error: true

      - name: Release artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{github.workspace}}/build/${{env.BUILD_TYPE}}/artifact.tar
          name: Releases

      - name: Create GitHub Release
        if: ${{github.event_name}} == 'pull_request'
        uses: marvinpinto/action-automatic-releases@latest
        id: create_release
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          title: ${{github.event.pull_request.title}}
        continue-on-error: false

      - name: Upload Binary
        if: ${{github.event_name}} == "pull_request"
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{github.workspace}}/build/${{env.BUILD_TYPE}}/
          asset_name: artifact.tar
          asset_content_type: application/zip
