name: Windows Build and Deployment

on:
  push:
    branches: ["V1"]

env:
  BUILD_TYPE: Release
  BOOST_PRE_DOWNLOAD_LINK: "https://boost.teeks99.com/bin/1.78.0/boost_1_78_0-msvc-14.3-64.exe"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: "false"
          submodules: "true"

      - name: Download boost
        run: Invoke-WebRequest -Uri ${{env.BOOST_PRE_DOWNLOAD_LINK}} -OutFile  "boost_installer.exe"

      - name: Install Boost
        run: Start-Process -FilePath "boost_installer.exe" -ArgumentList "/VERYSILENT" -Wait

      - name: Configure Arthur
        working-directory: ${{github.workspace}}/
        run: cmake -B build -DFMT_UNICODE=0 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build Arthur
        working-directory: ${{github.workspace}}/
        run: |
          cmake --build build --config ${{env.BUILD_TYPE}} --target install -j6
          cmake --build build --config ${{env.BUILD_TYPE}} --target install -j6
          cd build
          tree

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            LICENSE 
            README.md

      - name: Create GitHub Release
        if: false
        uses: marvinpinto/action-automatic-releases@latest
        id: create_release
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build"

      - name: Upload Binary
        if: false
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{github.workspace}}/build/${{env.BUILD_TYPE}}/
          asset_name: |
            Arthur.exe
          asset_content_type: application/zip
