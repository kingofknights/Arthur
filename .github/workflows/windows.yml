name: Windows Build and Deployment

on:
  push:
    branches: ["workflow"]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update submodule
        run: |
          git submodule init
          git submodule update --recursive --remote

      # - name: Install boost
      #   run: choco install boost-msvc-14.3

      - name: Make working-directory
        run: mkdir build

      - name: Download Dependencies
        working-directory: ${{github.workspace}}/build
        run: |
          git clone https://github.com/nlohmann/json.git
          git clone https://github.com/fmtlib/fmt.git
          git clone https://github.com/SRombauts/SQLiteCpp.git 
          ls

      - name: Install json
        working-directory: ${{github.workspace}}/build/json
        run: |
          git checkout v3.11.2
          cmake -B build -DJSON_BuildTests=OFF
          cmake --build build --config Release
          cmake --install build --config Release

      - name: Install fmt
        working-directory: ${{github.workspace}}/build/fmt
        run: |
          git checkout 10.0.0
          cmake -B build -DFMT_TEST=OFF
          cmake --build build --config Release
          cmake --install build --config Release

      - name: Install SQLiteCpp
        working-directory: ${{github.workspace}}/build/SQLiteCpp
        run: |
          git checkout 3.3.2
          cmake -B build -DSQLITECPP_BUILD_TESTS=OFF -DSQLITECPP_RUN_CPPLINT=OFF 
          cmake --build build --config Release
          cmake --install build --config Release
