name: Windows Build and Deployment

on:
  push:
    branches: [ "relesing_binary" ]

env:
  BUILD_TYPE: Release
  BOOST_PRE_DOWNLOAD_LINK: "https://boost.teeks99.com/bin/1.78.0/boost_1_78_0-msvc-14.3-64.exe"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: 'false'
          submodules: 'true'

      #      - name: Download boost
      #        run: Invoke-WebRequest -Uri ${{env.BOOST_PRE_DOWNLOAD_LINK}} -OutFile  "boost_installer.exe"
      #
      #      - name: Install Boost
      #        run: Start-Process -FilePath "boost_installer.exe" -ArgumentList "/VERYSILENT" -Wait
      #
      #      - name: Verify Installation
      #        run: Get-Command "boost_*" -ErrorAction SilentlyContinue
      #
      #      - name: Configure Arthur
      #        working-directory: ${{github.workspace}}/
      #        run: cmake -B build -DFMT_UNICODE=0
      #
      #      - name: Build Arthur
      #        working-directory: ${{github.workspace}}/
      #        run: cmake --build build

      - name: Create GitHub Release
        uses: marvinpinto/action-automatic-releases@latest
        id: create_release
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build"
          files: README.md

      - name: Upload Binary
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{github.workspace}}
          asset_name: README.md
          asset_content_type: application/zip