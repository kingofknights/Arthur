name: Compile Rider (Windows MinGW Docker Builder)

on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        description: 'Choose the Rider branch to compile'
        required: true
        default: 'master'
      message:
        type: string
        description: 'Release message / Name of artifact'
        required: true
        default: 'Rider-MinGW-Build'
  workflow_run:
    workflows: ["Build Windows MinGW Docker Image"]
    types:
      - completed

jobs:
  compile:
    name: "Compile Rider using Windows MinGW Docker Image"
    runs-on: windows-2022
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Rider Codebase
        uses: actions/checkout@v4
        with:
          repository: "kingofknights/Rider"
          token: ${{ secrets.Arthur_Token }}
          submodules: "true"
          ref: ${{ github.event.inputs.branch || 'master' }}

      - name: Ensure Docker is running
        shell: powershell
        run: |
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            Write-Host "Docker service status: $($service.Status)"
            if ($service.Status -ne 'Running') {
              Write-Host "Starting Docker service..."
              Start-Service docker
              Start-Sleep -Seconds 10
            }
          } else {
            Write-Warning "Docker service not found!"
          }
          docker version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Windows Docker Image
        run: |
          docker pull ghcr.io/kingofknights/arthur:v1.0-mingw

      - name: Compile Rider in Docker Container
        run: |
          docker run --rm -v "${{ github.workspace }}:C:\workspace" ghcr.io/kingofknights/arthur:v1.0-mingw

      - name: Prepare and Compress Artifacts
        shell: powershell
        run: |
          $workspace = "${{ github.workspace }}"
          $distPath = Join-Path $workspace "dist"
          
          if (-not (Test-Path $distPath)) {
              Write-Host "Creating dist directory..."
              New-Item -ItemType Directory -Path $distPath | Out-Null
          }
          
          $files = Get-ChildItem -Path $distPath -ErrorAction SilentlyContinue
          if ($null -eq $files -or $files.Count -eq 0) {
              Write-Host "dist directory is empty or not found. Copying files manually from build folder..."
              Get-ChildItem -Path (Join-Path $workspace "build") -Filter *.exe -Recurse | Copy-Item -Destination $distPath -Force -ErrorAction SilentlyContinue
              Get-ChildItem -Path (Join-Path $workspace "build") -Filter *.dll -Recurse | Copy-Item -Destination $distPath -Force -ErrorAction SilentlyContinue
              Get-ChildItem -Path (Join-Path $workspace "build") -Filter *.ttf -Recurse | Copy-Item -Destination $distPath -Force -ErrorAction SilentlyContinue
              Get-ChildItem -Path $workspace -Filter setting.json -Recurse | Copy-Item -Destination $distPath -Force -ErrorAction SilentlyContinue
          }
          
          Write-Host "=== Contents of dist directory ==="
          Get-ChildItem -Path $distPath | Format-Table Name, Length
          
          Write-Host "Compressing files into artifact.zip..."
          $zipPath = Join-Path $workspace "artifact.zip"
          Compress-Archive -Path (Join-Path $distPath "*") -DestinationPath $zipPath -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.message || 'Rider-MinGW-Build' }}
          path: artifact.zip
